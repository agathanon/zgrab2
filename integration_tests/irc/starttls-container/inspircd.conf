# Minimal InspIRCd configuration for the zgrab2 IRC STARTTLS integration test.
# Plaintext client port on 6667 with the IRCv3 STARTTLS extension available
# (provided by the ssl_gnutls module). Open registration -- no opers, no
# passwords.

<server name="irc.target.test"
        description="zgrab2 integration test"
        network="TestNet">

<admin name="test"
       description="test"
       email="test@target.test">

# Plaintext client port. STARTTLS is offered here because an SSL module and an
# sslprofile are configured below.
<bind address=""
      port="6667"
      type="clients">

<connect allow="*"
         timeout="60"
         pingfreq="120"
         hardsendq="262144"
         softsendq="8192"
         recvq="8192"
         localmax="100"
         globalmax="100"
         maxchans="20">

<files motd="/etc/inspircd/inspircd.motd">

# Load the GnuTLS module and define a profile pointing at the self-signed cert
# generated in the Dockerfile. The cap module provides IRCv3 capability
# negotiation, and the starttls module advertises the tls capability and
# enables the STARTTLS command on the plaintext port.
<module name="ssl_gnutls">
<module name="cap">
<module name="starttls">

<sslprofile name="server"
            provider="gnutls"
            certfile="/etc/inspircd/ssl/cert.pem"
            keyfile="/etc/inspircd/ssl/key.pem">

<options prefixquit="Quit: "
         exemptchanops="">
