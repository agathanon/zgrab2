# Minimal ngIRCd configuration for the zgrab2 IRC integration test.
# Open registration only -- no operators, no passwords, no PAM -- so that an
# unauthenticated client (as zgrab2 always is) completes registration and
# receives the welcome numerics, ISUPPORT, and MOTD.

[Global]
    Name = irc.target.test
    Info = zgrab2 integration test IRC server
    Ports = 6667
    # A non-empty MOTD ensures the server sends RPL_MOTD lines rather than
    # ERR_NOMOTD, so the scan result has a populated motd field.
    MotdPhrase = "Welcome to the zgrab2 integration test IRC server."

[Options]
    # Disable PAM so clients may connect without authenticating.
    PAM = no
